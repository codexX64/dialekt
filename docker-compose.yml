# DIALEKT seul, sans le Hub : docker compose up -d --build
# Les réglages viennent de .env (voir .env.example).
services:
  dialekt:
    build: .
    image: dialekt:local
    container_name: dialekt
    restart: unless-stopped
    env_file: .env
    ports:
      - "${DIALEKT_PORT:-8112}:8112"
    volumes:
      - dialekt-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    # Journaux du conteneur, où part aussi le journal de sécurité : gardés par
    # le démon Docker, hors de portée du service, cinq fichiers de 10 Mo.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  dialekt-data:
